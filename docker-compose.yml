version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gogym_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrong!Passw0rd1
    ports:
      - "1433:1433"
    volumes:
      - gogym_sql_data:/var/opt/mssql

volumes:
  gogym_sql_data: